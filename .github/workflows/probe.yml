name: Probe

# Prints the signatures of the Minecraft classes listed in .github/probe/*.txt,
# used to write the version-specific adapters.
on:
  push:
    paths:
      - ".github/probe/**"
  workflow_dispatch:

jobs:
  forge:
    name: Probe 1.8.9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        working-directory: forge-1.8.9
        run: chmod +x gradlew && ./gradlew redoProbe --console=plain -q
      - name: Print
        if: always()
        run: cat forge-1.8.9/build/probe/*.txt || true

  fabric:
    name: Probe ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        working-directory: fabric
        run: chmod +x gradlew && ./gradlew ":${{ matrix.mc }}:redoProbe" --console=plain -q
      - name: Print
        if: always()
        run: cat fabric/build/probe/*.txt || true
