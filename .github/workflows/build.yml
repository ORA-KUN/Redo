name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the shared core
        working-directory: core
        run: chmod +x gradlew && ./gradlew test --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/

  forge:
    name: Redo 1.8.9 (Forge)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Minecraft classes
        working-directory: forge-1.8.9
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew redoProbe --stacktrace
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-1.8.9
          path: forge-1.8.9/build/probe/
          if-no-files-found: ignore
      - name: Build
        working-directory: forge-1.8.9
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: redo-1.8.9
          path: forge-1.8.9/build/libs/*.jar

  fabric:
    name: Redo ${{ matrix.mc }} (Fabric)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe Minecraft classes
        working-directory: fabric
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew ":${{ matrix.mc }}:redoProbe" --stacktrace
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.mc }}
          path: fabric/build/probe/
          if-no-files-found: ignore
      - name: Build
        working-directory: fabric
        run: ./gradlew ":${{ matrix.mc }}:buildAndCollect" --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: redo-${{ matrix.mc }}
          path: fabric/build/libs/*/*.jar
